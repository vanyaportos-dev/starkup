<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет — STARKUP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-page">
  <div class="container">
    <div class="dashboard-header">
      <h1>ЛИЧНЫЙ КАБИНЕТ</h1>
      <div style="display:flex;gap:12px;align-items:center;">
        <span id="userName" style="color:var(--text-secondary);"></span>
        <button class="btn-ghost" onclick="logout()">
          <i class="fas fa-sign-out-alt"></i> Выйти
        </button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="totalOrders">0</div>
        <div class="stat-label">Всего заказов</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalSpent">0₽</div>
        <div class="stat-label">Потрачено всего</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalGold">0G</div>
        <div class="stat-label">Куплено голды</div>
      </div>
    </div>

    <div style="margin-bottom:24px;">
      <a href="/" class="btn-blurple">
        <i class="fas fa-coins"></i> Купить ещё голду
      </a>
    </div>

    <h2 style="font-size:24px;font-weight:700;margin-bottom:16px;">ИСТОРИЯ ЗАКАЗОВ</h2>
    <div style="overflow-x:auto;">
      <table class="orders-table" id="ordersTable">
        <thead>
          <tr>
            <th>ID заказа</th>
            <th>Дата</th>
            <th>Голда</th>
            <th>Сумма</th>
            <th>Статус</th>
          </tr>
        </thead>
        <tbody id="ordersBody">
          <tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:40px;">Загрузка...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
