<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель — STARKUP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin-page">
  <div class="container">
    <div class="dashboard-header">
      <h1>АДМИН-ПАНЕЛЬ</h1>
      <div style="display:flex;gap:12px;">
        <a href="/dashboard" class="btn-ghost">ЛК</a>
        <button class="btn-ghost" onclick="logout()">Выйти</button>
      </div>
    </div>

    <div class="admin-filters">
      <button class="btn-filter active" onclick="filterOrders('all', this)">Все</button>
      <button class="btn-filter" onclick="filterOrders('pending', this)">Ожидают</button>
      <button class="btn-filter" onclick="filterOrders('paid', this)">Оплачены</button>
      <button class="btn-filter" onclick="filterOrders('completed', this)">Выполнены</button>
    </div>

    <div style="overflow-x:auto;">
      <table class="orders-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Email</th>
            <th>Голда</th>
            <th>Сумма</th>
            <th>Статус</th>
            <th>Дата</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="adminOrdersBody">
          <tr><td colspan="7" style="text-align:center;padding:40px;">Загрузка...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="admin.js"></script>
</body>
</html>
